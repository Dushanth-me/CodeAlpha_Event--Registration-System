<!DOCTYPE html>
<html>
<head>
    <title>Registered Participants</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: left;
        }

        th {
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Registered Participants</h1>

    {% if registrations %}
    <table>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone Number</th>
            <th>Event</th>
        </tr>

        {% for registration in registrations %}
        <tr>
            <td>{{ registration.name }}</td>
            <td>{{ registration.email }}</td>
            <td>{{ registration.phone }}</td>
            <td>{{ registration.event}}</td>
        </tr>
        {% endfor %}
    </table>

    {% else %}
        <p>No registrations found.</p>
    {% endif %}

</body>
</html>
